# fly.toml app configuration file generated for agent-games-agent-zlqxcw on 2026-11-14T19:57:38Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'agent-games-agent-zlqxcw'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  SEEN_SET_PATH = '/data/seen-set.json'

[[mounts]]
  source = 'pegasus_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
